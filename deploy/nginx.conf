# nginx reverse proxy for the Multi-Agent Research Assistant
# Install to: /etc/nginx/sites-available/research-assistant
# then symlink:
#   sudo ln -s /etc/nginx/sites-available/research-assistant /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace YOUR_DOMAIN_OR_IP below. If you only have the public IP, use
# `server_name _;` and reach it via http://<public-ip>/.

server {
    listen 80;
    server_name YOUR_DOMAIN_OR_IP;

    # Standard proxy to the uvicorn app.
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── SSE endpoint: the live-progress stream ──────────────────────────
    # SSE breaks if nginx buffers the response, so we disable buffering and
    # caching, and allow a long read timeout for slow research runs.
    location ~ ^/api/research/.+/stream$ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }
}
